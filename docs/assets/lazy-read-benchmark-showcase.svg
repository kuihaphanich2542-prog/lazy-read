<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="burnRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="saveGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="55%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .blink { animation: blinkAnim 1.2s infinite; }
      .pulse-border { animation: pulseBorder 2.5s infinite ease-in-out; }
      .meter-grow { animation: meterGrow 3s infinite ease-out; }
      @keyframes blinkAnim {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.3; }
      }
      @keyframes pulseBorder {
        0%, 100% { stroke-opacity: 1; }
        50% { stroke-opacity: 0.5; }
      }
      @keyframes meterGrow {
        0% { width: 30px; }
        70%, 100% { width: 488px; }
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="650" rx="16" fill="#030712" stroke="#1e293b" stroke-width="2" />

  <!-- Top Header -->
  <text x="600" y="38" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#f8fafc">
    BENCHMARK SHOWCASE: <tspan fill="#f87171">Standard AI Exploration</tspan> vs. <tspan fill="#34d399">lazy-read v1.7.0</tspan>
  </text>

  <!-- ==================== LEFT SCREEN: BEFORE / STANDARD ==================== -->
  <g transform="translate(24, 58)">
    <rect width="564" height="568" rx="12" fill="url(#panelBg)" stroke="#ef4444" stroke-width="1.8" />
    <!-- Window Bar -->
    <rect width="564" height="38" rx="12" fill="#230f14" />
    <circle cx="20" cy="19" r="6" fill="#ef4444" />
    <circle cx="38" cy="19" r="6" fill="#f59e0b" />
    <circle cx="56" cy="19" r="6" fill="#3b82f6" />
    <text x="282" y="24" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#fca5a5">
      BEFORE LAZY-READ: Full Raw Dumps (cat / grep / read)
    </text>

    <!-- Terminal Lines -->
    <text x="20" y="70" class="mono" font-size="12.5" fill="#94a3b8">$ agent explore --full-repo --read-all</text>
    <text x="20" y="96" class="mono" font-size="12" fill="#f87171">Execution Telemetry (Context Flooded):</text>
    <text x="32" y="118" class="mono" font-size="12" fill="#e2e8f0">• Codebase Raw Read:       <tspan fill="#ef4444" font-weight="700">~65,352 tokens</tspan> (unbounded)</text>
    <text x="32" y="138" class="mono" font-size="12" fill="#e2e8f0">• Long Spec Docs (MD/PDF): <tspan fill="#ef4444" font-weight="700">~86,799 tokens</tspan> (script/css noise)</text>
    <text x="32" y="158" class="mono" font-size="12" fill="#e2e8f0">• 50,000-Row CSV/XLSX:     <tspan fill="#ef4444" font-weight="700">~1,176,414 tokens</tspan> (OVERFLOW!)</text>
    <text x="32" y="178" class="mono" font-size="12" fill="#e2e8f0">• Error Lookup (2 calls):   <tspan fill="#fca5a5">grep + Read window (~167 tokens)</tspan></text>
    <text x="32" y="198" class="mono" font-size="12" fill="#e2e8f0">• Function Git Diff:       <tspan fill="#fca5a5">git log -p -3 (~3,660 tokens)</tspan></text>
    <text x="32" y="218" class="mono" font-size="12" fill="#e2e8f0">• Broad Search (22 hits):   <tspan fill="#fca5a5">grep -rn (~600 tokens + .pyc noise)</tspan></text>

    <line x1="20" y1="236" x2="544" y2="236" stroke="#334155" stroke-dasharray="4 4" />

    <text x="20" y="262" class="mono" font-size="12" fill="#f87171">Agent Investigation Trace:</text>
    <text x="32" y="286" class="mono" font-size="11.5" fill="#cbd5e1">[Turn 1] cat *.py / read_file dumps 65k tokens into context</text>
    <text x="32" y="306" class="mono" font-size="11.5" fill="#cbd5e1">[Turn 2] Loading 50k rows table triggers 200k context limit error</text>
    <text x="32" y="326" class="mono" font-size="11.5" fill="#f87171">[Turn 3] Context Window Saturated (6.4x limit) - Task Aborted!</text>
    <text x="32" y="346" class="mono" font-size="11.5" fill="#fca5a5">[Failure] Out of memory &amp; token budget depleted</text>

    <!-- Verdict Card -->
    <rect x="20" y="372" width="524" height="176" rx="10" fill="#2a1215" stroke="#dc2626" stroke-width="1.5" />
    <text x="38" y="400" class="mono" font-size="14" font-weight="800" fill="#f87171">OUTCOME: CONTEXT WINDOW OVERFLOW &amp; HIGH COST</text>
    <text x="38" y="426" class="mono" font-size="13" fill="#fecaca">• Combined Task Tokens:       <tspan font-weight="800" fill="#ffffff">~1,291,706 tokens (6.4x limit!)</tspan></text>
    <text x="38" y="450" class="mono" font-size="13" fill="#fecaca">• Multi-Step Round-Trips:     <tspan font-weight="800" fill="#ffffff">Slow (2-3 calls per symbol)</tspan></text>
    <text x="38" y="474" class="mono" font-size="13" fill="#fecaca">• Context Survival Status:    <tspan font-weight="800" fill="#ef4444" class="blink">FAILED (Context Overrun)</tspan></text>
    <text x="38" y="498" class="mono" font-size="12" fill="#fca5a5">• Context Saturation Meter (200k Window):</text>
    <rect x="38" y="510" width="488" height="14" rx="7" fill="#0f172a" />
    <rect x="38" y="510" width="488" height="14" rx="7" fill="url(#burnRed)" />
  </g>

  <!-- ==================== RIGHT SCREEN: AFTER LAZY-READ ==================== -->
  <g transform="translate(612, 58)">
    <rect width="564" height="568" rx="12" fill="url(#panelBg)" stroke="#10b981" stroke-width="2" class="pulse-border" />
    <!-- Window Bar -->
    <rect width="564" height="38" rx="12" fill="#062e20" />
    <circle cx="20" cy="19" r="6" fill="#ef4444" />
    <circle cx="38" cy="19" r="6" fill="#f59e0b" />
    <circle cx="56" cy="19" r="6" fill="#3b82f6" />
    <text x="282" y="24" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#6ee7b7">
      AFTER LAZY-READ: Read the map first, then slice
    </text>

    <!-- Terminal Lines -->
    <text x="20" y="70" class="mono" font-size="12.5" fill="#94a3b8">$ lazy-read map . &amp;&amp; lazy-read slice symbol</text>
    <text x="20" y="96" class="mono" font-size="12" fill="#34d399">Execution Telemetry (Surgical Precision):</text>
    <text x="32" y="118" class="mono" font-size="12" fill="#e2e8f0">• Codebase Skeleton:        <tspan fill="#34d399" font-weight="700">~1,468 tokens (-97.75%)</tspan></text>
    <text x="32" y="138" class="mono" font-size="12" fill="#e2e8f0">• Long Spec Docs:           <tspan fill="#34d399" font-weight="700">~8,114 tokens (-90.65%)</tspan></text>
    <text x="32" y="158" class="mono" font-size="12" fill="#e2e8f0">• 50,000-Row CSV/XLSX:      <tspan fill="#34d399" font-weight="700">~1,534 tokens (-99.87%)</tspan></text>
    <text x="32" y="178" class="mono" font-size="12" fill="#e2e8f0">• Error Lookup (1 call):    <tspan fill="#a7f3d0">find (~103 tokens, -38%)</tspan></text>
    <text x="32" y="198" class="mono" font-size="12" fill="#e2e8f0">• Function Git Diff:        <tspan fill="#a7f3d0">history (~90 tokens, -97.8%)</tspan></text>
    <text x="32" y="218" class="mono" font-size="12" fill="#e2e8f0">• Broad Search (22 hits):   <tspan fill="#a7f3d0">find compact (~196 tokens, -67%)</tspan></text>

    <line x1="20" y1="236" x2="544" y2="236" stroke="#334155" stroke-dasharray="4 4" />

    <text x="20" y="262" class="mono" font-size="12" fill="#34d399">Agent Investigation Trace:</text>
    <text x="32" y="286" class="mono" font-size="11.5" fill="#cbd5e1">[Turn 1] codemap inspect finds exact crashing function in 1 call</text>
    <text x="32" y="306" class="mono" font-size="11.5" fill="#cbd5e1">[Turn 2] docmap slice pulls exact specification requirement</text>
    <text x="32" y="326" class="mono" font-size="11.5" fill="#34d399">[Turn 3] tablemap agg verifies numbers without dumping raw data</text>
    <text x="32" y="346" class="mono" font-size="11.5" fill="#6ee7b7">[Success] 1-shot edit applied &amp; all 30/30 unit tests passed</text>

    <!-- Verdict Card -->
    <rect x="20" y="372" width="524" height="176" rx="10" fill="#042014" stroke="#059669" stroke-width="1.8" />
    <text x="38" y="400" class="mono" font-size="14" font-weight="800" fill="#34d399">OUTCOME: 99.34% TOKEN SAVINGS &amp; 1-SHOT ACCURACY</text>
    <text x="38" y="426" class="mono" font-size="13" fill="#d1fae5">• Combined Task Tokens:       <tspan font-weight="800" fill="#34d399">~8,588 tokens (150.4x smaller!)</tspan></text>
    <text x="38" y="450" class="mono" font-size="13" fill="#d1fae5">• Multi-Step Round-Trips:     <tspan font-weight="800" fill="#ffffff">1-shot execution with context</tspan></text>
    <text x="38" y="474" class="mono" font-size="13" fill="#d1fae5">• Context Window Consumption: <tspan font-weight="800" fill="#34d399" class="blink">&lt; 4.5% of 200k (PASSED)</tspan></text>
    <text x="38" y="498" class="mono" font-size="12" fill="#6ee7b7">• Token Efficiency Meter (Minimal Overhead):</text>
    <rect x="38" y="510" width="488" height="14" rx="7" fill="#061b11" />
    <rect x="38" y="510" width="22" height="14" rx="7" fill="url(#saveGreen)" />
  </g>
</svg>