<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .bar-anim { animation: barGrow 2s ease-out; }
      @keyframes barGrow { from { width: 0; } }
    </style>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Clean Minimal Background -->
  <rect width="1100" height="440" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <!-- Section Title -->
  <text x="40" y="44" class="sans" font-size="16" font-weight="700" fill="#f0f6fc">Performance Benchmark &amp; Token Footprint</text>
  <text x="40" y="66" class="sans" font-size="13" fill="#8b949e">Measured reduction across code exploration, long documents, and tabular data</text>

  <!-- Two Columns Container -->
  <!-- Left Card: Standard Raw Ingestion -->
  <g transform="translate(40, 92)">
    <rect width="490" height="308" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" />
    
    <!-- Card Header -->
    <text x="24" y="34" class="sans" font-size="14" font-weight="600" fill="#f85149">Standard AI Ingestion</text>
    <text x="24" y="52" class="sans" font-size="12" fill="#8b949e">Full file dumps (cat, read_file, raw grep)</text>

    <!-- Metrics List -->
    <g transform="translate(24, 76)">
      <!-- Item 1 -->
      <text x="0" y="16" class="sans" font-size="12" fill="#c9d1d9">Codebase Exploration</text>
      <text x="442" y="16" text-anchor="end" class="mono" font-size="12" fill="#8b949e">~65,352 tok</text>
      <rect x="0" y="24" width="442" height="6" rx="3" fill="#21262d" />
      <rect x="0" y="24" width="220" height="6" rx="3" fill="#da3633" />

      <!-- Item 2 -->
      <text x="0" y="56" class="sans" font-size="12" fill="#c9d1d9">Technical Spec Docs (MD/PDF)</text>
      <text x="442" y="56" text-anchor="end" class="mono" font-size="12" fill="#8b949e">~86,799 tok</text>
      <rect x="0" y="64" width="442" height="6" rx="3" fill="#21262d" />
      <rect x="0" y="64" width="280" height="6" rx="3" fill="#da3633" />

      <!-- Item 3 -->
      <text x="0" y="96" class="sans" font-size="12" fill="#c9d1d9">50,000-Row Table (CSV/XLSX)</text>
      <text x="442" y="96" text-anchor="end" class="mono" font-size="12" fill="#f85149">~1,176,414 tok (OOM)</text>
      <rect x="0" y="104" width="442" height="6" rx="3" fill="#21262d" />
      <rect x="0" y="104" width="442" height="6" rx="3" fill="#da3633" />
    </g>

    <!-- Bottom Summary Box -->
    <rect x="24" y="214" width="442" height="70" rx="8" fill="#21262d" />
    <text x="40" y="240" class="sans" font-size="12" fill="#8b949e">End-to-End Context Load</text>
    <text x="40" y="266" class="mono" font-size="20" font-weight="700" fill="#f85149">~1,291,706 tok</text>
    <text x="426" y="265" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#f85149">Exceeds 200k limit</text>
  </g>

  <!-- Right Card: Lazy-Read Pipeline -->
  <g transform="translate(570, 92)">
    <rect width="490" height="308" rx="10" fill="#161b22" stroke="#238636" stroke-width="1.2" />
    
    <!-- Card Header -->
    <text x="24" y="34" class="sans" font-size="14" font-weight="600" fill="#3fb950">lazy-read Workflow</text>
    <text x="24" y="52" class="sans" font-size="12" fill="#8b949e">Map-first indexing + surgical slicing</text>

    <!-- Metrics List -->
    <g transform="translate(24, 76)">
      <!-- Item 1 -->
      <text x="0" y="16" class="sans" font-size="12" fill="#c9d1d9">Code Skeleton (codemap)</text>
      <text x="442" y="16" text-anchor="end" class="mono" font-size="12" font-weight="600" fill="#3fb950">~1,468 tok (-97.7%)</text>
      <rect x="0" y="24" width="442" height="6" rx="3" fill="#21262d" />
      <rect x="0" y="24" width="14" height="6" rx="3" fill="url(#gradEmerald)" />

      <!-- Item 2 -->
      <text x="0" y="56" class="sans" font-size="12" fill="#c9d1d9">Outline Slice (docmap)</text>
      <text x="442" y="56" text-anchor="end" class="mono" font-size="12" font-weight="600" fill="#3fb950">~8,114 tok (-90.6%)</text>
      <rect x="0" y="64" width="442" height="6" rx="3" fill="#21262d" />
      <rect x="0" y="64" width="38" height="6" rx="3" fill="url(#gradEmerald)" />

      <!-- Item 3 -->
      <text x="0" y="96" class="sans" font-size="12" fill="#c9d1d9">Schema &amp; Agg (tablemap)</text>
      <text x="442" y="96" text-anchor="end" class="mono" font-size="12" font-weight="600" fill="#3fb950">~1,534 tok (-99.9%)</text>
      <rect x="0" y="104" width="442" height="6" rx="3" fill="#21262d" />
      <rect x="0" y="104" width="15" height="6" rx="3" fill="url(#gradEmerald)" />
    </g>

    <!-- Bottom Summary Box -->
    <rect x="24" y="214" width="442" height="70" rx="8" fill="#102419" stroke="#238636" stroke-width="1" />
    <text x="40" y="240" class="sans" font-size="12" fill="#7ee787">Optimized Total Footprint</text>
    <text x="40" y="266" class="mono" font-size="20" font-weight="700" fill="#3fb950">~8,588 tok</text>
    <text x="426" y="265" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#3fb950">-99.3% (&lt; 4.5% of context)</text>
  </g>
</svg>